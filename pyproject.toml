[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptopulse-aws-data-lake"
version = "0.1.0"
description = "Serverless CoinGecko Demo API data lake on AWS"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [{ name = "NguyenPhuTrieu" }]
dependencies = [
  "duckdb>=1.5.5,<2",
  "httpx>=0.28.1,<1",
  "pytz>=2026.3.post1,<2027",
  "streamlit>=1.61,<2",
]

[project.scripts]
cryptopulse = "cryptopulse.cli:main"

[project.urls]
Repository = "https://github.com/TrieuNguyenPhu/cryptopulse-aws-data-lake"

[project.optional-dependencies]
dev = [
  "build>=1.5,<2",
  "mypy>=2.3,<3",
  "pre-commit>=4.6,<5",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/cryptopulse/dashboard.py" = ["E501"] # CSS and HTML templates stay readable.

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests/unit", "tests/contract", "tests/integration"]
markers = [
  "contract: validates external and internal data contracts",
  "integration: requires explicit external integration opt-in",
  "live_api: may reach CoinGecko only when both live opt-in flags are set",
]

[tool.coverage.run]
branch = true
source = ["cryptopulse"]
omit = ["src/cryptopulse/dashboard.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
