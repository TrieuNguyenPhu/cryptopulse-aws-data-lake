[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptopulse-aws-data-lake"
version = "0.1.0"
description = "Serverless CoinGecko Demo API data lake on AWS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "NguyenPhuTrieu" }]
dependencies = [
  "boto3>=1.35,<2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "moto[dynamodb,s3]>=5,<6",
  "mypy>=1.14,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests/unit", "tests/contract", "tests/integration"]
markers = [
  "contract: validates external and internal data contracts",
  "integration: requires explicit external integration opt-in",
  "live_api: may reach CoinGecko only when both live opt-in flags are set",
]

[tool.coverage.run]
branch = true
source = ["cryptopulse"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
